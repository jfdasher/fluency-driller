[project]
name = "drill"
version = "0.1.0"
description = "Fluency Drill System — IPython-based idiom recall practice with LLM grading"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "James Dasher" }]
dependencies = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "anthropic>=0.40",
    "pydantic>=2.6",
    "httpx>=0.27",
    "ipython>=8.0",
    "itsdangerous>=2.0",
    "numpy>=1.26",
    "pandas>=2.1,<3",
    "pyyaml>=6.0",
    "tabulate>=0.9",
]

[project.scripts]
drill-import = "drill.server.importer:main"
drill-import-topics = "drill.server.importer:import_topics_main"
drill-generate = "drill.content.generator:main"
drill-build-manifest = "drill.content.manifest:main"
drill-nvim-host = "drill.client.nvim_host:main"

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["drill"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["content"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E501",  # long lines: prompts and SQL read better unwrapped
    "B008",  # FastAPI's Depends()/Query() in defaults is idiomatic
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["E402"]  # tests import fixtures per section
