    note: "naive a.values + b.values misaligns; SQL never auto-aligns rows"
  - topic: "conform a Series to a new index with reindex, filling absent labels with NaN"
    kind: idiom

index/sort-index:
  - topic: "sort a DataFrame by its row index with sort_index"
    kind: recall
  - topic: "sort a MultiIndex so label-slicing stops raising (lexsort depth)"
