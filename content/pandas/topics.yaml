# Topic seeds for the content generator — pandas corpus (Opus-authored).
#
# slug -> list of { topic, kind, note? }
#   topic : terse drill-sized seed phrase, the generation focus
#   kind  : idiom | recall  (idiom = there's an idiomatic-vs-naive fork the
#           judge can discriminate; recall = pure "do you remember the syntax")
#   note  : optional disambiguation for the generator — often the naive fork to
#           beat, or the SQL concept this bridges from.
#
# Slug taxonomy + per-slug scope/tiers live in drill/data/topics_pandas.json.
# Canonical version target: pandas 2.x (numpy-backed). SQL analogies are leaned
# on hard per the design spec. Test contract for this corpus: tests import pandas
# and assert with pandas.testing.assert_frame_equal / assert_series_equal — the
# runner's equal() helper does NOT work on pandas objects.

# ── 1 · numpy-foundations ────────────────────────────────────────────────
numpy-foundations/vectorization:
  - topic: "add two numpy arrays elementwise without a Python loop"
    kind: idiom
    note: "naive fork is a for-loop or list comprehension; want a + b"
  - topic: "compute a boolean array of which elements exceed a threshold"
    kind: idiom
  - topic: "scale every element of an array by a scalar via broadcasting"
    kind: recall

numpy-foundations/boolean-masking:
  - topic: "select the array elements greater than zero with a boolean mask"
    kind: idiom
  - topic: "replace negative values with zero using np.where"
    kind: idiom
  - topic: "zero out masked positions in place with arr[mask] = 0"
    kind: idiom

numpy-foundations/dtypes:
  - topic: "cast an integer array to float64 with astype and report its dtype"
    kind: recall
  - topic: "show that inserting a NaN upcasts an int array to float"
    kind: idiom
    note: "NaN is a float; the array can't stay int"

numpy-foundations/axis-semantics:
  - topic: "sum a 2-D array down the columns (axis=0) vs across the rows (axis=1)"
    kind: idiom
    note: "the axis-direction confusion is the whole point"
  - topic: "take a row-wise max keeping dims for broadcasting (keepdims=True)"
    kind: recall

numpy-foundations/nan-handling:
  - topic: "compute a mean that ignores NaN with np.nanmean"
    kind: idiom
    note: "naive np.mean returns nan when any element is nan"
  - topic: "build a boolean mask of NaN positions with np.isnan"
    kind: recall

numpy-foundations/random-generator:
  - topic: "make a seeded default_rng and draw standard-normal samples"
    kind: recall
    note: "modern Generator API, not the legacy np.random.seed"
  - topic: "draw random integers in a half-open range with rng.integers"
    kind: recall

numpy-foundations/ndarray-basics:
  - topic: "create a 3x4 array of zeros and report its shape"
    kind: recall
  - topic: "reshape a 1-D arange into a 2-D grid"
    kind: recall

