    note: "forgetting the parentheses is the classic precedence bug"

selection/isin-between:
  - topic: "keep rows whose category is in a set of allowed values with isin"
    kind: idiom
    note: "naive fork chains == with | for each value"
  - topic: "drop rows whose value falls inside a range using ~between"
    kind: idiom

selection/chained-assignment:
  - topic: "assign to a filtered subset with .loc[mask, col] = value"
    kind: idiom
