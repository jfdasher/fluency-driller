  - topic: "work on a copy so the original frame is untouched (copy first)"
    kind: idiom

selection/query-eval:
  - topic: "filter rows with a readable query() expression referencing an @variable"
    kind: idiom
  - topic: "reference a column whose name has spaces using backticks in query"
