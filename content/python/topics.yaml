gotchas/copy:
  # A copy only matters under mutation AFTER copying. Snapshot-in-a-loop
  # discriminates because the accumulator keeps changing; deep-vs-shallow needs
  # an inner-cell mutation to reveal the shared sublist. Bake both in. Keep
  # atomic — NO backtracking/search puzzles (off-altitude).
  - topic: "append a running snapshot cur[:] each loop step so captured states stay independent (without [:] they all alias the final list)"
    kind: idiom
  - topic: "deep-copy a nested list, mutate one inner cell, and leave the original unchanged (a shallow copy shares the inner sublists)"
    kind: idiom

