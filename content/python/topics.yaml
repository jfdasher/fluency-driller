comprehensions/filtering:
  # Centre the if-clause-vs-ternary CONTRAST (see next-slugs.md): a trailing
  # if-clause SELECTS/drops items (no transform); a ternary in the value position
  # TRANSFORMS every item. NB: the combined filter+map form (e.g. [x*x for x in xs
  # if cond]) already lives in comprehensions/basic (even-squares, upper-long-words)
  # — do NOT reseed it here. Keep this slug on the pure select-vs-transform contrast.
  - topic: "select a subset with a trailing if-clause, dropping non-matching items (not transforming them)"
    kind: idiom
  - topic: "transform every item with a conditional ternary in the comprehension's value position, keeping all items (not dropping any)"
    kind: idiom

