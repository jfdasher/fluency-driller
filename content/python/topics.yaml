    note: "anti-idiom target: redundant ternary"

gotchas/aliasing:
  # The [[0]*n]*m trap only shows under MUTATION (all-zero grids compare equal
  # either way). Seeds bake in a cell-set / append so the test discriminates.
  - topic: "build an m×n grid of zeros, set one cell, and return it — the [[0]*n]*m trap corrupts the whole column"
    kind: idiom
  - topic: "create n independent buckets then append to one — the [[]]*n trap shares a single list"
    kind: idiom
  - topic: "replicate a given row m times then change one copy — the [row]*m trap mutates every copy"
