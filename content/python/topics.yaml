# Topic seeds for the content generator (Phase A, Opus-authored).
#
# slug -> list of { topic, kind, note? }
#   topic : terse drill-sized seed phrase, the generation focus
#   kind  : idiom | recall  (idiom = there's an idiomatic-vs-naive fork the
#           judge can discriminate; recall = pure "do you remember the syntax")
#   note  : optional disambiguation for the generator
#
# Slug taxonomy + per-slug scope/tiers live in drill/data/topics_python.json;
# see the generating-drill-questions skill (.claude/skills/) for how this is used.
# Deferred chapters (concurrency/async/subprocess/socket/sqlite3/packaging/
# performance) are intentionally omitted per the taxonomy's v2->v3 list.

